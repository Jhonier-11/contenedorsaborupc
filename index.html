<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaborUPC</title>
  <meta name="theme-color" content="#12432b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="http://localhost:8085/tokens.css">
  <link rel="stylesheet" href="contenedor.css">
</head>
<body>
  <header class="app-header">
    <a href="#/catalogo" class="app-logo">SaborUPC</a>
    <nav class="app-nav">
      <a href="#/catalogo" data-ruta="/catalogo">Catálogo</a>
      <a href="#/carrito" data-ruta="/carrito">Carrito <span id="app-contador" class="app-badge">0</span></a>
      <a href="#/pedidos" data-ruta="/pedidos">Pedidos</a>
      <a href="#/perfil" data-ruta="/perfil">Perfil</a>
    </nav>
    <span id="app-saludo" class="app-saludo">Hola, invitado</span>
  </header>

  <!-- Aquí el contenedor monta el micro frontend que corresponda a la ruta -->
  <main id="app-root"></main>

  <div id="app-toasts" class="app-toasts" aria-live="polite"></div>

  <footer class="app-footer">Contenedor v1.0 · cada sección es un micro frontend independiente</footer>

  <script src="registro.js"></script>
  <script src="contenedor.js"></script>
</body>
</html>
